<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图纸校对｜豆作间</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/__review/review.css"><script type="module" src="/__review/review.js"></script></head>
<body><main class="rv-app"><header class="rv-header pixel-frame"><div><p class="rv-kicker">豆作间 · 本地后台</p><h1>图纸校对</h1><p>对照原图补色号，修改保存在这台电脑。</p></div><a class="small-button" href="/#library">返回图纸库</a></header>
<p id="rv-status" role="status" class="rv-status">正在读取图纸…</p>
<div id="rv-sync-panel" class="rv-sync-panel" hidden><strong>线上同步</strong><span id="rv-sync-status">保存后自动比对并更新</span><button class="small-button" id="rv-sync-retry">重新比对 / 重试</button></div><div class="rv-layout"><aside class="pixel-frame rv-sidebar"><h2>图纸清单</h2><label class="rv-label">查找图纸<input id="rv-search" type="search" placeholder="编号或名称"></label><label class="rv-label">显示范围<select id="rv-filter"><option value="pending">有待确认格</option><option value="all">全部图纸</option></select></label><p id="rv-count"></p><nav id="rv-list" aria-label="选择校对图纸"></nav></aside>
<section id="rv-work" class="pixel-frame rv-work" hidden><header class="rv-heading"><div><h2 id="rv-name"></h2><p id="rv-info"></p></div><a class="small-button" id="rv-library-link" href="/#library">查看图库效果</a></header>
<div class="rv-toolbar"><button class="small-button" id="rv-edit-undo" title="撤销未保存编辑（Ctrl+Z）" disabled>↶ 撤销编辑</button><button class="small-button" id="rv-edit-redo" title="重做未保存编辑（Ctrl+Shift+Z / Ctrl+Y）" disabled>↷ 重做编辑</button><label>行 <input id="rv-row" type="number" min="1" aria-label="定位行"></label><label>列 <input id="rv-column" type="number" min="1" aria-label="定位列"></label><button class="small-button" id="rv-locate">定位</button><button class="small-button" id="rv-next">下一个待确认格</button><label class="rv-zoom-label">缩放 <input id="rv-zoom" type="range" min="50" max="800" step="1" value="100" aria-label="校对视图缩放"><output id="rv-zoom-value">100%</output></label></div>
<div class="rv-pair"><section><div class="rv-panel-title"><h3>原图纸</h3><a id="rv-original-link" target="_blank" rel="noopener" href="#">打开完整原图 ↗</a></div><div id="rv-source-window" class="rv-window" aria-label="原图纸视窗"></div><p id="rv-source-file" class="rv-caption"></p></section><section><div class="rv-panel-title"><h3>当前图纸数据</h3><span id="rv-dirty"></span></div><div id="rv-data-window" class="rv-window" aria-label="图纸数据视窗"></div><p class="rv-caption">点击原图或数据图选格。滚轮可连续缩放，放大后可滚动查看。</p></section></div>
<div class="rv-edit"><section class="rv-crop-panel"><h3 id="rv-selected">选中格</h3><canvas id="rv-crop" width="330" height="330" aria-label="选中格及周围原图放大"></canvas><label class="rv-contrast"><input id="rv-contrast" type="checkbox">增强对比</label><p class="rv-caption">红框是选中格，按原始像素放大。</p></section><section class="rv-editor"><h3>补色号</h3><p id="rv-current"></p><label class="rv-label">MARD 色号<div class="rv-code-row"><span id="rv-swatch"></span><input id="rv-code" list="rv-colors" autocomplete="off" placeholder="例如 G02" aria-label="填写MARD色号"><button id="rv-apply" class="button blue">填入这一格</button></div></label><datalist id="rv-colors"></datalist><div class="rv-minor-actions"><button class="small-button" id="rv-empty">这一格不放豆</button><button class="small-button" id="rv-unknown">标为待确认</button></div><p class="rv-caption">同图已用色号，点击可填入选中格：</p><div id="rv-used" class="rv-used"></div><h4>待确认位置</h4><div id="rv-pending" class="rv-pending"></div></section></div>
<section class="rv-bulk"><h3>批量换色 · 当前图纸</h3><div class="rv-bulk-fields"><label>原色号<select id="rv-bulk-from" aria-label="批量替换原色号"></select></label><span>→</span><label>新色号<input id="rv-bulk-to" list="rv-colors" placeholder="例如 G02" aria-label="批量替换新色号"></label><span id="rv-bulk-swatch"></span><button id="rv-bulk-apply" class="button blue">预览批量替换</button></div><p id="rv-bulk-preview"></p><p class="rv-caption">先在右图预览，点击“保存本张图纸”后才会更新。空格保留，已保存的批量修改可撤回。</p></section><footer class="rv-savebar"><div><strong id="rv-save-state">没有未保存修改</strong><p>保存、撤回和重做保存均会同步图纸、缩略图和用量。</p></div><div class="rv-save-actions"><button id="rv-discard" class="small-button">清除未保存修改</button><button id="rv-undo" class="small-button">撤回上次保存</button><button id="rv-redo" class="small-button" disabled>重做保存</button><button id="rv-save" class="button yellow">保存本张图纸</button></div></footer><details class="rv-history"><summary>人工保存记录</summary><div id="rv-history"></div></details></section></div></main></body></html>
